<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PipOS interactions · local preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #25233f; color: #fff4e7; font: 16px system-ui; }
    main { max-width: 820px; margin: auto; }
    h1 { font: 700 32px Georgia, serif; }
    .pip-preview { max-width: 340px; margin: auto; }
  </style>
</head>
<body>
  <main><h1>PipOS interaction preview</h1><div id="pip" class="pip-preview"></div><div id="nightlight"></div></main>
  <script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import { PipCharacter, NightlightLab } from './index.ts'
    if (location.search.includes('nightlight')) {
      document.querySelector('.pip-preview').hidden = true
      document.querySelector('h1').textContent = 'Nightlight Collection'
    }
    createRoot(document.getElementById('pip')).render(React.createElement(PipCharacter, { mood: 'night' }))
    createRoot(document.getElementById('nightlight')).render(React.createElement(NightlightLab, { muted: true }))
  </script>
</body>
</html>
